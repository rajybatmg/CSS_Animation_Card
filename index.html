<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animation Cards</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Learning Animation Cards</h1>
  <div class="card-container">
    <div class="card fade-in" style="background-color: #ffeaa7;">
      <img src="images/dean.jpg" alt="Fade icon" class="icon"/>
      <h2>Fade In</h2>
      <p>This card uses a keyframe-based fade-in animation.</p>
    </div>
    <div class="card slide-in" style="background-color: #e9cac2;">
      <img src="images/sujan.jpg" alt="Slide icon" class="icon"/>
      <h2>Slide In</h2>
      <p>This card slides in from the left using keyframes.</p>
    </div>
    <div class="card bounce" style="background-color: #97afc7;">
      <img src="images/raj.png" alt="Bounce icon" class="icon"/>
      <h2>Bounce</h2>
      <p>This card has a bounce animation using keyframes.</p>
    </div>
    <div class="card scale-hover" style="background-color: #9eaaa7;">
      <img src="https://cdn-icons-png.flaticon.com/128/1828/1828970.png" alt="Scale icon" class="icon"/>
      <h2>Scale on Hover</h2>
      <p>This card scales up smoothly using hover and transition.</p>
    </div>
  </div>
</body>
</html>
